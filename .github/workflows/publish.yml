name: CI

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

jobs:
  # The image build is self-contained - the Dockerfile compiles the Flutter
  # bundle itself - so all this job has to work out is what to tag the result
  # with.
  version:
    name: Resolve image version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # A tag publishes its own version. Every other push publishes a
      # prerelease version derived from the release-please manifest, so branch
      # builds get unique image tags and can never take over the 1/1.0 aliases
      # of a released image (docker/metadata-action does not emit those for a
      # prerelease).
      - name: Resolve image version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            BASE="$(jq -r '.["."]' .release-please-manifest.json)"
            SLUG="$(printf '%s' "$REF_NAME" | tr -c '0-9A-Za-z-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')"
            # No commit sha in here: the branch tag is meant to move with the
            # branch, and the workflow adds an immutable sha-<short> tag anyway.
            VERSION="${BASE}-${SLUG}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing image version $VERSION"

  # Harbor sits behind a proxy that caps request bodies at 100 MB, and a plain
  # `docker push` sends each layer as a single request - which is why pushing
  # the bundle layer used to fail. The shared workflow builds to an OCI archive
  # and pushes it with regctl, splitting blobs above 50 MiB across several
  # PATCH requests, then keyless-signs the result via OIDC.
  docker:
    name: Publish image
    needs: version
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.8.1
    with:
      image-name: "onelitefeather/stelaris"
      version: ${{ needs.version.outputs.version }}
      context: "."
    secrets: inherit

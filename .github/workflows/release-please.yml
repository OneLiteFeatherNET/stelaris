name: Release

# release-please collects Conventional Commits into a release PR; merging it
# tags the version and cuts the GitHub release. Everything that has to happen
# for a release is chained into this same run on purpose: release-please tags
# with GITHUB_TOKEN, and a tag pushed that way does NOT start a separate
# `on: push: tags` workflow.
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.8.1
    secrets: inherit

  # Chained here rather than triggered by the tag, for the reason above - and
  # because the release is the only place that already knows the version, so
  # nothing has to derive one.
  #
  # Harbor sits behind a proxy that caps request bodies at 100 MB, and a plain
  # `docker push` sends each layer as a single request. The shared workflow
  # builds to an OCI archive and pushes it with regctl, splitting blobs above
  # 50 MiB across several PATCH requests, then keyless-signs the result.
  docker:
    name: Publish the image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.8.1
    with:
      image-name: "onelitefeather/stelaris"
      version: ${{ needs.release-please.outputs.version }}
      context: "."
    secrets: inherit

  sbom:
    name: Attach SBOM to release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: bom.json
          # An SBOM is an inventory, not a finding list - never fail on it.
          exit-code: '0'

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" bom.json --clobber

  # Chained into this run rather than triggered by the tag, for the reason at
  # the top of this file: release-please tags with GITHUB_TOKEN, and such a tag
  # starts no `on: push: tags` workflow.
  #
  # Charts are published on a release only. A branch build is deployed by
  # pointing an existing release of the chart at the branch's image tag, which
  # needs no chart of its own.
  helm:
    name: Publish the Helm chart
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      # Release Please keeps Chart.yaml's version and appVersion current, so
      # this only has to catch the case where that did not happen - publishing a
      # chart that points at an image tag nobody built is worse than not
      # publishing one.
      - name: Check the chart version matches the release
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          CHART_VERSION="$(helm show chart charts/stelaris-ui | awk '/^version:/ {print $2}')"
          APP_VERSION="$(helm show chart charts/stelaris-ui | awk '/^appVersion:/ {print $2}' | tr -d '"')"
          echo "release=$VERSION chart=$CHART_VERSION app=$APP_VERSION"
          test "$CHART_VERSION" = "$VERSION"
          test "$APP_VERSION" = "$VERSION"

      - name: Package
        run: helm package charts/stelaris-ui --destination dist

      - name: Log in to OneLiteFeather Harbor
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          USERNAME: ${{ secrets.HARBOR_USERNAME }}
          PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$PASSWORD" | helm registry login "$REGISTRY" --username "$USERNAME" --password-stdin

      # Into the same project as the image, so `helm show chart` and
      # `docker pull` name the same place.
      - name: Push
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: helm push "dist/stelaris-ui-${VERSION}.tgz" "oci://${REGISTRY}/stelaris"

      - name: Log out
        if: always()
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
        run: helm registry logout "$REGISTRY" || true

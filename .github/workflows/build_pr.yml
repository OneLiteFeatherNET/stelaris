name: Run tests
on: [ pull_request ]
jobs:
  # Analyzer, VM tests and browser tests run as separate jobs, so they run in
  # parallel and a failure says which of them broke.
  analyze:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Init Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run analyzer
        run: flutter analyze

  # The whole suite on the Dart VM: no per-file compile to JavaScript and no
  # browser, which is what made the run take this long.
  test:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Tests (VM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Init Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  # Only the tests tagged `web` (see dart_test.yaml): the ones driving text
  # input and keyboard handling, which Flutter treats differently in a
  # browser.
  test_web:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Tests (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Init Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test --platform chrome --tags web

  # The production Dockerfile was broken on develop for months - it copied an
  # nginx.conf that had been deleted from the tree - because nothing ever built
  # it outside a publish run. Building it here is what keeps that from
  # happening again; `nginx -t` runs inside the build, so a broken server
  # configuration fails here too.
  image:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not pushed anywhere: this job proves the image builds, it does not
      # publish. Releases and develop pushes do that, from their own
      # workflows.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # helm unittest asserts on the rendered templates directly - that the pod
  # really is unprivileged and read-only, that the runtime config is not
  # mounted with subPath - which rendering and grepping never did reliably.
  # ct lints the chart once per file in charts/stelaris-ui/ci/.
  chart:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Check the Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # ct lints what changed against the target branch, so it needs the
          # history to compare with.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Lint
        run: ct lint --config ct.yaml

      # Pinned rather than tracking HEAD: a plugin that changes under CI turns
      # an unrelated pull request red. Renovate keeps the pin current.
      # renovate: datasource=github-tags depName=helm-unittest/helm-unittest
      - name: Install the unittest plugin
        env:
          UNITTEST_VERSION: v1.2.1
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "$UNITTEST_VERSION" --verify=false

      - name: Unit tests
        run: helm unittest charts/stelaris-ui

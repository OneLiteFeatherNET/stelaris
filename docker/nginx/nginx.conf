# Main nginx configuration for the Stelaris UI image.
#
# This file replaces the one shipped in the base image rather than adding to
# it, so everything the server does is visible here or in conf.d/.
#
# There is no `user` directive on purpose: the master process of
# nginxinc/nginx-unprivileged already runs as uid 101, and setting `user` would
# require the root privileges this image does not have.

# Not `auto`: that counts the host's CPUs, not the container's cgroup limit, so
# a pod with 200m CPU on a 64-core node would start 64 workers and pay for all
# of them in memory. Two is ample for serving a few dozen static files - the
# work is sendfile() - and predictable. The base image tunes this from its
# entrypoint instead, which needs to rewrite this file and therefore cannot
# work here. A deployment that needs more raises it via a ConfigMap.
worker_processes 2;

# Nothing writes to a file. The container runtime collects both streams, and a
# read-only root filesystem stays possible because no log path has to exist.
error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Every path nginx may write to lives under /tmp, which is the one writable
    # mount the container needs (an emptyDir with medium: Memory in Kubernetes).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx ships no mapping for .mjs, so the Wasm entrypoint main.dart.mjs
    # would go out as application/octet-stream - and a browser refuses to
    # execute an ES module that is not served with a JavaScript MIME type, which
    # stops the app from booting at all. A second `types` block adds to the
    # included map rather than replacing it.
    types {
        text/javascript mjs;
    }

    # The nginx version in Server: and on error pages is free reconnaissance
    # for anyone scanning for a known CVE.
    server_tokens off;

    # JSON, because these lines are read by a log collector in a cluster, not
    # by a person tailing a file.
    log_format json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"forwarded_for":"$http_x_forwarded_for"'
        '}';
    access_log /dev/stdout json;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  65s;
    keepalive_requests 1000;

    # This server answers GET and HEAD for static files. Nothing here has a use
    # for a request body, and the buffers only need to fit a normal request
    # line plus headers - so a slow-loris or an oversized-header probe runs out
    # of budget instead of out of memory.
    client_max_body_size        1k;
    client_body_buffer_size     1k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                30s;
    reset_timedout_connection   on;

    # The bundle is precompressed at image build time, so gzip_static serves a
    # .gz sibling without spending any CPU. gzip itself stays on for the files
    # the build skipped (anything under 1 KiB) and for generated responses.
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/conf.d/*.conf;
}

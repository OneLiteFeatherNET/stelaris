# The one server this image runs.
#
# nginx drops headers inherited from an outer block as soon as a location adds
# one of its own, so the security-headers include has to be repeated in every
# location rather than written once at server level. The copy at server level
# is not redundant either: it covers the responses this server produces before
# any location is picked.

server {
    # IPv4 only, deliberately. `listen [::]:8080` makes nginx exit at startup
    # wherever the network namespace has no IPv6 - a node booted with
    # ipv6.disable=1, for one - which is why the base image adds that line from
    # its entrypoint only after checking /proc/net/if_inet6, and skips it
    # entirely on a read-only filesystem. A container that refuses to start is
    # the worse failure, so the default here is the one that always works.
    #
    # A dual-stack deployment adds the listener back by mounting a ConfigMap
    # key over this file. See docs/docker-image.md.
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Redirects must come back relative: this server always sits behind an
    # ingress, and an absolute redirect would send the client to the pod's own
    # host and port.
    absolute_redirect off;
    port_in_redirect  off;

    # A listing would hand out the layout of the whole bundle.
    autoindex off;

    # Covers what the server answers on its own - the 405 below, and any error
    # page nginx renders before a location is picked. The locations repeat the
    # include because their own add_header discards this one.
    include /etc/nginx/snippets/security-headers.conf;

    # Static files, nothing else. Anything that is not a read is a probe.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Kubernetes liveness/readiness target. Kept out of the access log because
    # a probe every few seconds drowns out the requests worth reading.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Runtime configuration for the app.
    #
    # Served from outside the document root so that a Secret mounted over
    # /etc/nginx/runtime replaces it without touching the bundle. The image
    # ships an empty object, which makes the app fall back to its compiled-in
    # defaults instead of failing to start.
    #
    # no-store, because a cached configuration outlives the deployment that
    # produced it and then points the app at the wrong backend.
    location = /config.json {
        alias /etc/nginx/runtime/config.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Dotfiles never belong in the bundle, so a request for one is a probe;
    # answer it the same way a missing file is answered rather than confirming
    # that something is there.
    location ~ /\. {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # Anything that looks like a file has to 404 when it is missing. Falling
    # back to index.html here would answer a broken asset reference with 200
    # and a page of HTML, which turns a build error into a blank screen and a
    # console message about an unexpected MIME type.
    location ~* \.(?:js|mjs|wasm|json|css|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|bin|txt|xml|symbols)$ {
        include /etc/nginx/snippets/security-headers.conf;

        # Flutter does not content-hash its output file names - main.dart.wasm
        # keeps that name across every build - so a long max-age would pin
        # clients to a build that no longer exists. no-cache still allows the
        # cache: with the ETag nginx derives from the file, revalidation costs
        # a 304 and no body.
        add_header Cache-Control "no-cache" always;

        try_files $uri =404;
    }

    # Everything else is a route, not a file. go_router owns any path that does
    # not resolve, so a miss serves the app shell with a 200 - the SPA
    # equivalent of what the browser would have got had the route been a page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/ /index.html;
    }
}

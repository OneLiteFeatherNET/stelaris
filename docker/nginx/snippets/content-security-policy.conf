# The Content-Security-Policy for the app.
#
# This is the strictest policy a Flutter web bundle actually runs under, not
# the strictest a browser would accept. Every relaxation below is one Flutter
# requires:
#
#   'unsafe-inline'    web/index.html bootstraps Flutter from an inline script,
#                      and Flutter's loader does not support nonces
#                      (flutter/flutter#167800).
#   'unsafe-eval'      CanvasKit and the Wasm entrypoint compile at runtime
#                      (flutter/flutter#127658). 'wasm-unsafe-eval' is listed
#                      as well for browsers that honour the narrower form.
#   style-src inline   the framework injects styles into the document head.
#   blob: workers      Skwasm starts its render workers from blob URLs.
#
# connect-src is the one directive that depends on where this is deployed: it
# has to allow whatever backendUrl and generatorUrl in /config.json point at.
# `https:` is the default because the image is built once and promoted across
# environments, so it cannot know those hosts. It still blocks plain http:,
# ws:, and data: exfiltration channels.
#
# A deployment that knows its backends should replace this file with the exact
# origins - mount a ConfigMap key over
# /etc/nginx/snippets/content-security-policy.conf:
#
#   add_header Content-Security-Policy "... connect-src 'self' https://api.example ..." always;
#
# Anything not listed here falls back to default-src 'self'.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; connect-src 'self' https:" always;

# Response headers every location sends.
#
# `always` on each one, so the headers are still there on an error response -
# a 404 or a 405 renders HTML too, and that is exactly where a missing
# X-Content-Type-Options starts to matter.
#
# Strict-Transport-Security is deliberately absent: TLS terminates at the
# ingress, which is the only place that knows whether the deployment is
# actually reachable over HTTPS and on which hostnames. Sending HSTS from here
# would let a plain-HTTP dev deployment lock a browser out of the host.
#
# X-XSS-Protection is absent for the opposite reason: the header is retired,
# every browser that still reads it treats it as a bug source rather than a
# defence, and the CSP below does the job it was meant to do.

# Stop the browser from second-guessing a Content-Type. Flutter serves .wasm
# and .mjs whose handling depends entirely on being labelled correctly.
add_header X-Content-Type-Options "nosniff" always;

# frame-ancestors in the CSP is the modern form of this; the header stays for
# clients that do not enforce that directive.
add_header X-Frame-Options "DENY" always;

# Send the full URL only within our own origin. Cross-origin requests - which
# is what any backend call to another host is - see the origin alone, never a
# path that might carry an id.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here is meant to be embedded by another site.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Isolates this page's browsing-context group from anything it opens or that
# opens it. `-allow-popups` rather than plain `same-origin` because the app
# opens external links in a new tab and plain same-origin severs the opener
# relationship those depend on.
#
# This is not cross-origin isolation: that additionally needs COEP, which is
# off because it breaks every cross-origin resource that does not opt in via
# CORP/CORS, and buys only multi-threaded Wasm rendering in return.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# The app is a data editor: it needs none of these, so a compromised
# dependency cannot reach for them either.
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# Its own file so a deployment can tighten connect-src for its environment by
# mounting one ConfigMap key over it, without replacing this whole snippet.
include /etc/nginx/snippets/content-security-policy.conf;

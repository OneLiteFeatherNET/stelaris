<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <script src="flutter.js"></script>

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Define models">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Stelaris">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/webp" href="../assets/logo_stelaris_v1.webp"/>

    <title>Stelaris</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #ffffff;
            --spinner-track: rgba(0, 0, 0, 0.08);
            --spinner-color: #66bb6a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --spinner-track: rgba(255, 255, 255, 0.1);
                --spinner-color: #26a69a;
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--spinner-track);
            border-radius: 50%;
            border-top-color: var(--spinner-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        (function() {
            try {
                const raw = localStorage.getItem('appState');
                if (raw) {
                    const state = JSON.parse(raw);
                    const theme = state.themeSettings;
                    if (theme) {
                        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        const isDark = theme.useSystemTheme ? systemDark : theme.isDarkMode;

                        document.documentElement.style.setProperty('--bg-color', isDark ? '#121212' : '#ffffff');
                        document.documentElement.style.setProperty('--spinner-track', isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.08)');

                        if (theme.primaryColor) {
                            const hex = (theme.primaryColor >>> 0).toString(16).padStart(8, '0');
                            document.documentElement.style.setProperty('--spinner-color', '#' + hex.substring(2));
                        }
                    }
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
<div id="loading-screen">
    <div class="spinner"></div>
</div>

<script>
    {{flutter_build_config}}
    _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
            const appRunner = await engineInitializer.initializeEngine();

            const loader = document.getElementById('loading-screen');
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 300);
            }

            await appRunner.runApp();
        }
    });
</script>
</body>
</html>

{{- if not .Values.config.existingSecret }}
{{- /*
  A Secret rather than a ConfigMap, even though these are URLs and not
  credentials: it is the same document the browser will be handed, and a
  deployment that later needs to put something sensitive in it should not have
  to move the whole mechanism to get there.

  Fields left empty are omitted from the document entirely, because the app
  falls back to its compiled-in default per field. A key with an empty string
  would say nothing different and would hide that nothing was configured.
*/}}
{{- $config := dict -}}
{{- with .Values.config.backendUrl }}{{- $_ := set $config "backendUrl" . -}}{{- end -}}
{{- with .Values.config.generatorUrl }}{{- $_ := set $config "generatorUrl" . -}}{{- end -}}
{{- /*
  The auth block follows the same rule one level down, but as a unit rather than
  per field: without an issuer, a client id and at least one scope there is no
  sign-in to attempt, so a partial block is left out entirely. The app discards
  one anyway and logs that it did; not serving it keeps the document honest about
  what is configured. Absent, the app runs unauthenticated.
*/}}
{{- $auth := dict -}}
{{- with .Values.config.auth -}}
{{- if and .issuer .clientId .scopes -}}
{{- $_ := set $auth "issuer" .issuer -}}
{{- $_ := set $auth "clientId" .clientId -}}
{{- $_ := set $auth "scopes" .scopes -}}
{{- with .audience }}{{- $_ := set $auth "audience" . -}}{{- end -}}
{{- with .roleClaims }}{{- $_ := set $auth "roleClaims" . -}}{{- end -}}
{{- with .roleClaimsSource }}{{- $_ := set $auth "roleClaimsSource" . -}}{{- end -}}
{{- with .roleAliases }}{{- $_ := set $auth "roleAliases" . -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- with $auth }}{{- $_ := set $config "auth" . -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stelaris-ui.fullname" . }}-config
  labels:
    {{- include "stelaris-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.secretKey }}: |-
{{ $config | toPrettyJson | indent 4 }}
{{- end }}

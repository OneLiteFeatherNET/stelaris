suite: runtime configuration
templates:
  - secret.yaml
  - configmap-nginx.yaml
  - deployment.yaml
tests:
  - it: renders an empty document when nothing is configured
    # The app falls back to its compiled-in defaults per field, so an empty
    # object is the honest thing to serve. A key with an empty string would
    # look configured and behave the same.
    template: secret.yaml
    asserts:
      - equal:
          path: stringData["config.json"]
          value: "{}"

  - it: leaves out a field that was not set
    template: secret.yaml
    set:
      config.backendUrl: https://api.example/v1
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"backendUrl": "https://api\.example/v1"'
      - notMatchRegex:
          path: stringData["config.json"]
          pattern: 'generatorUrl'

  - it: renders both URLs when both are set
    template: secret.yaml
    set:
      config.backendUrl: https://api.example/v1
      config.generatorUrl: https://gen.example
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"generatorUrl": "https://gen\.example"'

  - it: creates no Secret when an existing one is named
    template: secret.yaml
    set:
      config.existingSecret: managed-elsewhere
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts the existing Secret instead
    template: deployment.yaml
    set:
      config.existingSecret: managed-elsewhere
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: runtime-config
            secret:
              secretName: managed-elsewhere
              items:
                - key: config.json
                  path: config.json

  - it: projects a differently named key as config.json
    # nginx serves whatever is at that path, so the key in the Secret is free
    # to be named for whatever manages it.
    template: deployment.yaml
    set:
      config.existingSecret: managed-elsewhere
      config.secretKey: stelaris-ui.json
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: runtime-config
            secret:
              secretName: managed-elsewhere
              items:
                - key: stelaris-ui.json
                  path: config.json

  - it: creates no nginx ConfigMap unless something overrides the image
    template: configmap-nginx.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: wraps a policy in the add_header directive nginx expects
    template: configmap-nginx.yaml
    set:
      nginx.contentSecurityPolicy: "default-src 'self'; connect-src 'self' https://api.example"
    asserts:
      - equal:
          path: data["content-security-policy.conf"]
          value: |
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.example" always;

  - it: leaves out the auth block when no provider is configured
    # An unauthenticated deployment has to keep rendering exactly what it
    # rendered before this block existed.
    template: secret.yaml
    set:
      config.backendUrl: https://api.example/v1
    asserts:
      - notMatchRegex:
          path: stringData["config.json"]
          pattern: 'auth'

  - it: renders the auth block when issuer, clientId and scopes are set
    template: secret.yaml
    set:
      config.backendUrl: https://api.example/v1
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
        - profile
        - offline_access
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"issuer": "https://kc\.example/realms/stelaris"'
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"clientId": "stelaris-ui"'
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"offline_access"'

  - it: renders the same block for a differently shaped issuer
    # Nothing in the chart or the app is provider-specific; this is the same
    # assertion as above against a tenant-shaped issuer rather than a realm.
    template: secret.yaml
    set:
      config.auth.issuer: https://login.microsoftonline.com/contoso/v2.0
      config.auth.clientId: 00000000-0000-0000-0000-000000000000
      config.auth.scopes:
        - openid
        - api://11111111-1111-1111-1111-111111111111/access_as_user
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"issuer": "https://login\.microsoftonline\.com/contoso/v2\.0"'
      - matchRegex:
          path: stringData["config.json"]
          pattern: 'access_as_user'

  - it: omits an auth block that names no scopes
    # A partial block cannot produce a sign-in that succeeds. The app discards
    # one and logs it; the chart does not serve it in the first place.
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
    asserts:
      - equal:
          path: stringData["config.json"]
          value: "{}"

  - it: omits an auth block that names no client
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.scopes:
        - openid
    asserts:
      - equal:
          path: stringData["config.json"]
          value: "{}"

  - it: omits an auth block that names no issuer
    template: secret.yaml
    set:
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
    asserts:
      - equal:
          path: stringData["config.json"]
          value: "{}"

  - it: leaves out audience and roleClaims when they are not set
    # Both are optional: the app requests no audience and falls back to its
    # built-in claim paths. An empty key would look configured.
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
    asserts:
      - notMatchRegex:
          path: stringData["config.json"]
          pattern: 'audience'
      - notMatchRegex:
          path: stringData["config.json"]
          pattern: 'roleClaims'

  - it: renders an audience when one is named
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
      config.auth.audience: stelaris-backend
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"audience": "stelaris-backend"'

  - it: renders a claim path the built-in defaults do not cover
    # The point of making this configuration: a provider that puts roles
    # somewhere unforeseen is a value here, not a code change.
    template: secret.yaml
    set:
      config.auth.issuer: https://tenant.example/oidc
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
      config.auth.roleClaims:
        - https://stelaris.example/roles
        - urn:example:app:roles
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"https://stelaris\.example/roles"'
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"urn:example:app:roles"'

  - it: renders the claim sources a deployment names
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
      config.auth.roleClaimsSource:
        - accessToken
        - idToken
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"accessToken"'
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"idToken"'
      - notMatchRegex:
          path: stringData["config.json"]
          pattern: 'userInfo'

  - it: leaves out the claim sources when none are named
    # Unset means the app searches all three; an empty key would say something
    # different and mean the same.
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
    asserts:
      - notMatchRegex:
          path: stringData["config.json"]
          pattern: 'roleClaimsSource'

  - it: renders a role alias table
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
      config.auth.roleAliases:
        6dbd7a4d-d61c-47f5-8f7d-db368e3f9dae: stelaris.admin
    asserts:
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"6dbd7a4d-d61c-47f5-8f7d-db368e3f9dae": "stelaris\.admin"'

  - it: leaves out an empty alias table
    template: secret.yaml
    set:
      config.auth.issuer: https://kc.example/realms/stelaris
      config.auth.clientId: stelaris-ui
      config.auth.scopes:
        - openid
    asserts:
      - notMatchRegex:
          path: stringData["config.json"]
          pattern: 'roleAliases'

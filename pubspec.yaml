  web: ^1.1.1
  vulpes_data:
    git:
      url: https://github.com/OneLiteFeatherNET/vulpes-minecraft-dart.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1

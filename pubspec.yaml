name: stelaris
description: UI for Stelaris

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.10.8 <4.0.0"
  flutter: "^3.38.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  go_router: 17.1.0
  freezed_annotation: ^3.1.0
  dio: ^5.9.1
  dio_cache_interceptor: ^4.0.5
  localstorage: ^6.0.0
  async_redux: ^26.4.2
  intl: ^0.20.2
  json_annotation: ^4.10.0
  web: ^1.1.1
  vulpes_data:
    git:
      url: https://github.com/OneLiteFeatherNET/vulpes-minecraft-dart.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.12.0

flutter:
  uses-material-design: true
  generate: true

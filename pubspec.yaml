name: stelaris
description: UI for Stelaris

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: "^3.41.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  go_router: 17.2.2
  freezed_annotation: ^3.1.0
  dio: ^5.9.2
  dio_cache_interceptor: ^4.0.6
  localstorage: ^6.0.0
  async_redux: 27.1.1

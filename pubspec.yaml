name: stelaris
description: UI for Stelaris

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.4.0 # x-release-please-version

environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: "^3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  localstorage: ^6.0.0
  async_redux: 28.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  web: ^1.1.1
  vulpes_data:
    git:
      url: https://github.com/OneLiteFeatherNET/vulpes-minecraft-dart.git
      ref: master
  stelaris_models:
    git:
      url: https://github.com/OneLiteFeatherNET/stelaris-model.git
      ref: main
  material_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/

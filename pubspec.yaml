name: stelaris
description: UI for Stelaris

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: "^3.38.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  go_router: 17.0.0
  freezed_annotation: ^3.1.0
  dio: ^5.9.0
  dio_cache_interceptor: ^4.0.5
  localstorage: ^6.0.0
  async_redux: 26.0.0

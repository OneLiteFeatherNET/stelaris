  vulpes_data:
    git:
      url: https://github.com/OneLiteFeatherNET/vulpes-minecraft-dart.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:

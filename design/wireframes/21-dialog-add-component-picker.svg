  <text x="472.0" y="292.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#39693B" text-anchor="start">Properties</text>
  <rect x="560.0" y="280.0" width="14" height="14" rx="4" fill="none" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="564.0" y1="284.0" x2="570.0" y2="290.0" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="570.0" y1="284.0" x2="564.0" y2="290.0" stroke="#C2C9BD" stroke-width="1"/>
  <text x="480.0" y="322.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#181D17" text-anchor="start">Max Damage</text>
  <text x="480.0" y="340.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">minecraft:max_damage</text>
  <text x="960.0" y="332.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="end">Default</text>
  <text x="480.0" y="372.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#181D17" text-anchor="start">Unbreakable</text>
  <text x="480.0" y="390.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">minecraft:unbreakable</text>

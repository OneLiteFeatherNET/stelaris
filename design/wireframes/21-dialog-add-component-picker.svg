  <text x="968.0" y="172.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="22" font-weight="400" fill="#424940" text-anchor="middle">×</text>
  <line x1="440.0" y1="194.0" x2="1000.0" y2="194.0" stroke="#C2C9BD" stroke-width="1"/>

  <text x="480.0" y="548.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#181D17" text-anchor="start">Dyed Color</text>
  <text x="480.0" y="566.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">minecraft:dyed_color</text>
  <text x="480.0" y="598.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#181D17" text-anchor="start">Rarity</text>
  <text x="480.0" y="616.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">minecraft:rarity</text>
  <text x="960.0" y="608.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="end">Default</text>
  <text x="472.0" y="644.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#39693B" text-anchor="start">Consumable</text>
  <rect x="560.0" y="632.0" width="14" height="14" rx="4" fill="none" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="564.0" y1="636.0" x2="570.0" y2="642.0" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="570.0" y1="636.0" x2="564.0" y2="642.0" stroke="#C2C9BD" stroke-width="1"/>
  <text x="480.0" y="674.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#181D17" text-anchor="start">Food</text>
  <text x="480.0" y="692.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">minecraft:food</text>
  <rect x="1040" y="200" width="260" height="94" rx="4" fill="#FFF4C2" stroke="#E0C200" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1050" y="220" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">Grouped by category; tapping a</text>
  <text x="1050" y="238" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">heading filters to it.</text>
  <text x="1050" y="256" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">Row tap → Component edit dialog.</text>
  <text x="1050" y="274" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">No action buttons.</text>
</svg>

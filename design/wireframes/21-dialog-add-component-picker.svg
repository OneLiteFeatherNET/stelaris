  <text x="480.0" y="440.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">minecraft:max_stack_size</text>
  <text x="960.0" y="432.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="end">Default</text>
  <text x="472.0" y="468.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#39693B" text-anchor="start">Display</text>

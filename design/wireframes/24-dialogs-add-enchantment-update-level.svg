<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>24 Dialogs – Add enchantment &amp; Update level</title>
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#F7FBF1" stroke="none" stroke-width="1"/>
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#000000" fill-opacity="0.32" stroke="none" stroke-width="1"/>
  <rect x="120" y="250" width="520" height="400" rx="16" fill="#E6E9E0" stroke="none" stroke-width="1"/>
  <text x="144" y="292" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#181D17" text-anchor="start">Add a enchantment</text>
  <text x="608" y="292" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="22" font-weight="400" fill="#424940" text-anchor="middle">×</text>
  <line x1="120" y1="314" x2="640" y2="314" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="120" y1="578" x2="640" y2="578" stroke="#C2C9BD" stroke-width="1"/>
  <rect x="528" y="594" width="88" height="40" rx="20.0" fill="#39693B" stroke="#39693B" stroke-width="1"/>
  <text x="572.0" y="619.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Add</text>
  <text x="476.0" y="619.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#39693B" text-anchor="middle">Cancel</text>
  <rect x="144" y="338" width="472" height="56" rx="4" fill="none" stroke="#72796F" stroke-width="1"/>
  <rect x="154" y="331" width="80.6" height="14" rx="0" fill="#E6E9E0" stroke="none" stroke-width="1"/>
  <text x="158" y="342" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">Enchantment</text>
  <text x="160" y="371.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#181D17" text-anchor="start">Sharpness</text>
  <text x="594" y="371.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#424940" text-anchor="middle">▾</text>
  <rect x="148" y="420" width="18" height="18" rx="2" fill="#F7FBF1" stroke="#72796F" stroke-width="2"/>
  <text x="178" y="428" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#181D17" text-anchor="start">Unsafe</text>
  <text x="178" y="446" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">Allows levels above the normal maximum of the enchantment</text>
  <rect x="144" y="474" width="472" height="56" rx="4" fill="none" stroke="#72796F" stroke-width="1"/>
  <rect x="154" y="467" width="41.0" height="14" rx="0" fill="#E6E9E0" stroke="none" stroke-width="1"/>
  <text x="158" y="478" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">Level</text>
  <text x="160" y="507.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#181D17" text-anchor="start">1</text>
  <rect x="880" y="250" width="420" height="260" rx="16" fill="#E6E9E0" stroke="none" stroke-width="1"/>
  <text x="904" y="292" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#181D17" text-anchor="start">Update Level</text>
  <text x="1268" y="292" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="22" font-weight="400" fill="#424940" text-anchor="middle">×</text>
  <line x1="880" y1="314" x2="1300" y2="314" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="880" y1="438" x2="1300" y2="438" stroke="#C2C9BD" stroke-width="1"/>
  <rect x="1188" y="454" width="88" height="40" rx="20.0" fill="#39693B" stroke="#39693B" stroke-width="1"/>
  <text x="1232.0" y="479.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Save</text>
  <text x="1136.0" y="479.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#39693B" text-anchor="middle">Cancel</text>
  <rect x="904" y="338" width="372" height="56" rx="4" fill="none" stroke="#72796F" stroke-width="1"/>
  <rect x="914" y="331" width="41.0" height="14" rx="0" fill="#E6E9E0" stroke="none" stroke-width="1"/>
  <text x="918" y="342" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">Level</text>
  <text x="920" y="371.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#181D17" text-anchor="start">5</text>
  <text x="920" y="410" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#424940" text-anchor="start">The maximum is 5</text>
</svg>

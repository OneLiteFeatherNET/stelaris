  <line x1="418" y1="410.0" x2="406" y2="422.0" stroke="#A1A1AA" stroke-width="1"/>
  <rect x="510" y="300" width="420" height="260" rx="16" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1"/>

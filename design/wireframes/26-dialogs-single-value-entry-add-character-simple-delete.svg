  <text x="78" y="392" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#71717A" text-anchor="start"></text>
  <text x="80" y="421.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#18181B" text-anchor="start">&lt;gray&gt;Damage: +7</text>
  <rect x="402" y="406.0" width="20" height="20" rx="4" fill="none" stroke="#A1A1AA" stroke-width="1"/>

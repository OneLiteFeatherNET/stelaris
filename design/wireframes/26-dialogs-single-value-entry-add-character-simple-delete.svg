  <text x="1236.0" y="549.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#4C662B" text-anchor="middle">Cancel</text>
  <text x="1004" y="376" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181B" text-anchor="start">Delete Food from the item?</text>
  <rect x="1004" y="398" width="372" height="48" rx="10" fill="#F9DEDC" stroke="#B3261E" stroke-width="1"/>
  <rect x="1018" y="412" width="20" height="20" rx="4" fill="none" stroke="#A1A1AA" stroke-width="1"/>
  <line x1="1022" y1="416" x2="1034" y2="428" stroke="#A1A1AA" stroke-width="1"/>
  <line x1="1034" y1="416" x2="1022" y2="428" stroke="#A1A1AA" stroke-width="1"/>
  <text x="1050" y="427" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#B3261E" text-anchor="start">This action cannot be undone.</text>
  <rect x="40" y="620" width="440" height="58" rx="4" fill="#FFF4C2" stroke="#E0C200" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="50" y="640" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">Same single-field dialog: Add new line / Edit lore / Edit char.</text>
  <text x="50" y="658" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">Simple delete variants: enchantment, lore, char, component.</text>
</svg>

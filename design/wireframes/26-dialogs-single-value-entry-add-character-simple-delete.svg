  <text x="898" y="342" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="22" font-weight="400" fill="#71717A" text-anchor="middle">×</text>
  <line x1="510" y1="364" x2="930" y2="364" stroke="#A1A1AA" stroke-width="1"/>
  <line x1="510" y1="488" x2="930" y2="488" stroke="#A1A1AA" stroke-width="1"/>
  <rect x="818" y="504" width="88" height="40" rx="20.0" fill="#4C662B" stroke="#4C662B" stroke-width="1"/>
  <text x="862.0" y="529.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Add</text>
  <text x="766.0" y="529.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#4C662B" text-anchor="middle">Cancel</text>
  <rect x="534" y="388" width="372" height="56" rx="4" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1"/>
  <rect x="544" y="381" width="47.599999999999994" height="14" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <text x="548" y="392" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#71717A" text-anchor="start">Char *</text>

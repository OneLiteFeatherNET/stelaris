  <text x="428" y="342" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="22" font-weight="400" fill="#71717A" text-anchor="middle">×</text>
  <line x1="40" y1="364" x2="460" y2="364" stroke="#A1A1AA" stroke-width="1"/>

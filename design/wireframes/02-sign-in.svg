<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>02 Sign in</title>
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#F7FBF1" stroke="none" stroke-width="1"/>
  <rect x="696" y="300" width="48" height="48" rx="4" fill="#D5E8CF" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="700" y1="304" x2="740" y2="344" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="740" y1="304" x2="700" y2="344" stroke="#C2C9BD" stroke-width="1"/>
  <text x="720" y="390" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="24" font-weight="500" fill="#181D17" text-anchor="middle">Stelaris</text>
  <text x="720" y="424" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#424940" text-anchor="middle">Sign in to continue.</text>
  <rect x="658" y="450" width="124" height="40" rx="20.0" fill="#39693B" stroke="#39693B" stroke-width="1"/>
  <rect x="672" y="461.0" width="18" height="18" rx="4" fill="none" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="676" y1="465.0" x2="686" y2="475.0" stroke="#C2C9BD" stroke-width="1"/>
  <line x1="686" y1="465.0" x2="676" y2="475.0" stroke="#C2C9BD" stroke-width="1"/>
  <text x="730.0" y="475.0" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Sign in</text>
  <rect x="1100" y="40" width="300" height="166" rx="4" fill="#FFF4C2" stroke="#E0C200" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1110" y="60" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">Max width 420, centered.</text>
  <text x="1110" y="78" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">States of the message line:</text>
  <text x="1110" y="96" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">• Signed out: Sign in to continue.</text>
  <text x="1110" y="114" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">• Expired: Your session expired. Sign</text>
  <text x="1110" y="132" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">  in again to continue.</text>
  <text x="1110" y="150" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">• Unreachable: [cloud_off] icon, The</text>
  <text x="1110" y="168" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">  identity provider could not be</text>
  <text x="1110" y="186" font-family="Work Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C4B00" text-anchor="start">  reached… + button Try again</text>
</svg>

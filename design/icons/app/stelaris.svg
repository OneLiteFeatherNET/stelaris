<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Stelaris app icon: a flat Material 3 translation of assets/logo_stelaris_v1.webp.
       Palette sampled from that logo (see tool/generate_app_icons.sh header / PR body
       for the full derivation):
       navy sky/water   #0C0F2A   tower silhouette #193968
       sun core         #FFF6DD   sun mid          #F98E0E   sun halo #EC4C1B
       cloud            #B5AEDD   moon             #7E86A8   hill     #2F6B3E
       The circle is sized to ~88% of the canvas and centered on transparent,
       matching how the pixel-art logo reads as a badge. -->
  <defs>
    <clipPath id="frame">
      <circle cx="256" cy="256" r="225"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <circle cx="256" cy="256" r="225" fill="#0C0F2A"/>

    <!-- small stars -->
    <path d="M210,75 L215,80 L210,85 L205,80 Z" fill="#FFF6DD"/>
    <path d="M330,61 L334,65 L330,69 L326,65 Z" fill="#FFF6DD"/>
    <path d="M406,214 L411,219 L406,224 L401,219 Z" fill="#FFF6DD"/>

    <!-- comet -->
    <g transform="rotate(-25 300 78)">
      <path d="M254,78 L300,74 L300,82 Z" fill="#B5AEDD"/>
      <ellipse cx="304" cy="78" rx="10" ry="5" fill="#B5AEDD"/>
    </g>

    <!-- accent star -->
    <path d="M140,84 L147,103 L166,110 L147,117 L140,136 L133,117 L114,110 L133,103 Z" fill="#F98E0E"/>

    <!-- moon (crescent via an offset navy cutout) -->
    <circle cx="360" cy="160" r="38" fill="#7E86A8"/>
    <circle cx="373" cy="147" r="32" fill="#0C0F2A"/>

    <!-- clouds -->
    <circle cx="120" cy="292" r="30" fill="#B5AEDD"/>
    <circle cx="150" cy="278" r="38" fill="#B5AEDD"/>
    <circle cx="182" cy="294" r="28" fill="#B5AEDD"/>

    <circle cx="392" cy="292" r="30" fill="#B5AEDD"/>
    <circle cx="362" cy="278" r="38" fill="#B5AEDD"/>
    <circle cx="330" cy="294" r="28" fill="#B5AEDD"/>

    <!-- sun: concentric flat rings, no gradient -->
    <circle cx="256" cy="336" r="150" fill="#EC4C1B"/>
    <circle cx="256" cy="336" r="105" fill="#F98E0E"/>
    <circle cx="256" cy="336" r="60" fill="#FFF6DD"/>

    <!-- water: reset the sun's lower half back to navy, then reflection bars -->
    <rect x="31" y="336" width="450" height="150" fill="#0C0F2A"/>
    <rect x="206" y="346" width="100" height="10" fill="#F98E0E"/>
    <rect x="216" y="364" width="80" height="8" fill="#EC4C1B"/>
    <rect x="226" y="380" width="60" height="7" fill="#F98E0E"/>

    <!-- hills, in front of the water: two rounded tiers per side, hugging
         the bottom corners so the water stays open in the middle -->
    <rect x="31" y="400" width="130" height="81" rx="24" fill="#2F6B3E"/>
    <rect x="31" y="370" width="80" height="45" rx="18" fill="#2F6B3E"/>
    <rect x="351" y="400" width="130" height="81" rx="24" fill="#2F6B3E"/>
    <rect x="401" y="370" width="80" height="45" rx="18" fill="#2F6B3E"/>

    <!-- skyline: dense towers with a slim spire right of center and a taller
         tower further right -->
    <rect x="130" y="271" width="32" height="65" fill="#193968"/>
    <rect x="168" y="241" width="26" height="95" fill="#193968"/>
    <rect x="200" y="216" width="24" height="120" fill="#193968"/>
    <rect x="230" y="176" width="18" height="160" fill="#193968"/>
    <rect x="236" y="120" width="6" height="56" fill="#193968"/>
    <rect x="254" y="226" width="26" height="110" fill="#193968"/>
    <rect x="290" y="156" width="22" height="180" fill="#193968"/>
    <rect x="288" y="146" width="26" height="10" fill="#193968"/>
    <rect x="330" y="266" width="32" height="70" fill="#193968"/>
  </g>
</svg>

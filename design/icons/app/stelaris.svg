<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Stelaris app icon (Material 3 style). Palette from the primary tonal
       palette of ColorScheme.fromSeed(seedColor: Colors.green[400])
       (ThemeSettings.defaultSettings(), SchemeTonalSpot):
       background = primary tone 90 #BAF0B6, sun/moon = primary tone 70 #85B882,
       skyline/ground/star/outline = primary tone 15 #002D09.
       The motif is authored at a local scale centered on (256,256) and scaled
       up per variant via the outer <g transform>, so the same shapes serve
       the regular, maskable and monochrome files. -->
  <rect width="512" height="512" fill="#BAF0B6"/>

  <g transform="translate(244,235) scale(1.21) translate(-256,-256)">
    <!-- ground / horizon, filled below the sun's flat edge -->
    <rect x="86" y="292" width="340" height="168" fill="#002D09"/>

    <!-- sun rising behind the skyline: bright fill with a dark outline so it
         stays legible against the light background -->
    <path d="M96,300 A160,160 0 0 1 416,300 Z" fill="#85B882" stroke="#002D09" stroke-width="8" stroke-linejoin="round"/>

    <!-- skyline silhouette: narrow towers with wide gaps so the sun shows
         through between and around them -->
    <rect x="114" y="224" width="36" height="76" fill="#002D09"/>
    <rect x="178" y="180" width="32" height="120" fill="#002D09"/>
    <rect x="238" y="136" width="36" height="164" fill="#002D09"/>
    <path d="M238,136 L256,86 L274,136 Z" fill="#002D09"/>
    <rect x="302" y="180" width="32" height="120" fill="#002D09"/>
    <rect x="362" y="224" width="36" height="76" fill="#002D09"/>

    <!-- moon -->
    <circle cx="108" cy="150" r="28" fill="#85B882" stroke="#002D09" stroke-width="5"/>

    <!-- star -->
    <path d="M412,92 L423,121 L452,132 L423,143 L412,172 L401,143 L372,132 L401,121 Z" fill="#002D09"/>
  </g>
</svg>

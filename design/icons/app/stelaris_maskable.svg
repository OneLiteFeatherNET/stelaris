<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable variant: full-bleed navy sky, same scene as stelaris.svg scaled
       to 85% so its circular frame (radius 225 at scale 1) lands at ~191px
       from the 512px canvas center, inside the ~204.8px W3C maskable
       safe-zone radius (40% of the icon), with a small buffer. -->

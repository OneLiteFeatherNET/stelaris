<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Monochrome silhouette (purpose: monochrome): sun disc + skyline +
       horizon only, transparent background, single opaque fill (the OS
       recolors it). The sun disc is smaller than the color variant's so the
       outer towers keep real transparent gaps; only the tallest, central
       towers read as fused with the sun, same as a real skyline silhouette. -->
  <defs>
    <clipPath id="frameMono">
      <circle cx="256" cy="256" r="225"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameMono)">
    <!-- horizon -->
    <rect x="31" y="330" width="450" height="12" fill="#000000"/>

    <!-- sun disc: center sits below the horizon band, so only its narrowing
         upper cap shows above the roofline and the outer towers keep real
         transparent gaps instead of being bridged by the sun's widest point -->
    <circle cx="256" cy="380" r="100" fill="#000000"/>

    <!-- skyline -->
    <rect x="130" y="271" width="32" height="65" fill="#000000"/>
    <rect x="168" y="241" width="26" height="95" fill="#000000"/>
    <rect x="200" y="216" width="24" height="120" fill="#000000"/>
    <rect x="230" y="176" width="18" height="160" fill="#000000"/>
    <rect x="236" y="120" width="6" height="56" fill="#000000"/>
    <rect x="254" y="226" width="26" height="110" fill="#000000"/>
    <rect x="290" y="156" width="22" height="180" fill="#000000"/>
    <rect x="288" y="146" width="26" height="10" fill="#000000"/>
    <rect x="330" y="266" width="32" height="70" fill="#000000"/>
  </g>
</svg>

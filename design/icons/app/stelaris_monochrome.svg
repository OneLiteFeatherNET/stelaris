<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Monochrome silhouette (purpose: monochrome). Transparent background; the
       OS recolors this using its own tint. The sun disc is intentionally left
       out here: with every shape reduced to one opaque color, a filled sun
       would swallow the gaps between the towers and read as a single blob.
       Dropping it keeps the towers as distinct cut-out shapes. -->
  <g transform="translate(244,235) scale(1.21) translate(-256,-256)">
    <rect x="86" y="292" width="340" height="168" fill="#000000"/>

    <rect x="114" y="224" width="36" height="76" fill="#000000"/>
    <rect x="178" y="180" width="32" height="120" fill="#000000"/>
    <rect x="238" y="136" width="36" height="164" fill="#000000"/>
    <path d="M238,136 L256,86 L274,136 Z" fill="#000000"/>
    <rect x="302" y="180" width="32" height="120" fill="#000000"/>
    <rect x="362" y="224" width="36" height="76" fill="#000000"/>

    <circle cx="108" cy="150" r="28" fill="#000000"/>

    <path d="M412,92 L423,121 L452,132 L423,143 L412,172 L401,143 L372,132 L401,121 Z" fill="#000000"/>
  </g>
</svg>
